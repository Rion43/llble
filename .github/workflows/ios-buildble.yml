name: iOS Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string
        default: 'build-1'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile (use_frameworks + ReactAppDependencyProvider)
        run: |
          cd ios
          if ! grep -q "use_frameworks" Podfile; then
            ruby -e '
              lines = File.readlines("Podfile")
              idx = lines.index { |l| l.strip.start_with?("target") }
              lines.insert(idx, "use_frameworks! :linkage => :static\n")
              File.write("Podfile", lines.join)
            '
          fi
          ruby -e '
            lines = File.readlines("Podfile")
            lines.reject! { |l| l.include?("ReactAppDependencyProvider") }
            idx = lines.index { |l| l.strip.start_with?("post_install") }
            if idx
              lines.insert(idx, "pod \"ReactAppDependencyProvider\", :path => \"../.\"\n")
            else
              last_end = lines.rindex { |l| l.strip == "end" }
              lines.insert(last_end, "pod \"ReactAppDependencyProvider\", :path => \"../.\"\n")
            end
            File.write("Podfile", lines.join)
          '

      - name: CocoaPods install
        run: pod install --repo-update
        working-directory: ios

      - name: Build .app (unsigned)
        run: |
          cd ios
          xcodebuild \
            -workspace BandEngineiOSTest.xcworkspace \
            -scheme BandEngineiOSTest \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE_SPECIFIER= \
            FB_SONARKIT_ENABLED=NO

      - name: Package as .ipa
        run: |
          APP_PATH=$(find ios/build/Build/Products/Debug-iphoneos -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "${{ inputs.build_id }}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: '*.ipa'
          retention-days: 7
          if-no-files-found: error