name: Build iOS Dev Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Expo & dependencies
        run: |
          npm install -g expo
          npm install

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Patch Podfile (local ReactAppDependencyProvider)
        run: |
          cd ios
          if ! grep -q "ReactAppDependencyProvider" Podfile; then
            ruby -e '
              lines = File.readlines("Podfile")
              lines.reject! { |l| l.include?("ReactAppDependencyProvider") }
              idx = lines.index { |l| l.strip.start_with?("post_install") }
              if idx
                lines.insert(idx, "  pod \"ReactAppDependencyProvider\", :path => \"../.\"\n")
              else
                last_end = lines.rindex { |l| l.strip == "end" }
                lines.insert(last_end, "  pod \"ReactAppDependencyProvider\", :path => \"../.\"\n")
              end
              File.write("Podfile", lines.join)
            '
            echo "✓ Podfile patched"
          else
            echo "✓ Already patched or not needed"
          fi

      - name: CocoaPods install
        run: |
          cd ios
          pod install --repo-update

      - name: Read app name from package.json
        id: appname
        run: |
          RAW_NAME=$(jq -r .name package.json)
          SAFE_NAME=$(echo $RAW_NAME | tr -cd '[:alnum:]_')
          echo "APP_NAME=$SAFE_NAME" >> $GITHUB_ENV

      - name: Build iOS archive (unsigned)
        run: |
          xcodebuild \
            -workspace ios/${{ env.APP_NAME }}.xcworkspace \
            -scheme ${{ env.APP_NAME }} \
            -configuration Debug clean archive \
            -sdk iphoneos \
            -archivePath build/${{ env.APP_NAME }}.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA
        run: |
          cd build/${{ env.APP_NAME }}.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r ${{ env.APP_NAME }}.app Payload/
          zip -r ${{ env.APP_NAME }}.ipa Payload
          mv ${{ env.APP_NAME }}.ipa $GITHUB_WORKSPACE/

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: ${{ env.APP_NAME }}.ipa
