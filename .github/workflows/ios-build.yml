name: Build iOS Dev Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Expo & dependencies
        run: |
          npm install -g expo
          npm install

      - name: Expo prebuild
        run: |
          npx expo prebuild --platform ios --clean

      - name: Patch Podfile
        run: |
          cd ios
          ruby - <<'RUBY'
          podfile = File.read("Podfile")

          unless podfile.include?("pod 'fmt'")
            podfile.sub!(
              "post_install do |installer|",
              "pod 'fmt', '10.1.1'\n\npost_install do |installer|"
            )
          end

          File.write("Podfile", podfile)
          RUBY

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Read app name
        run: |
          echo "APP_NAME=$(jq -r .name package.json)" >> $GITHUB_ENV

      - name: Build Archive
        run: |
          xcodebuild \
            -workspace ios/${APP_NAME}.xcworkspace \
            -scheme ${APP_NAME} \
            -configuration Debug \
            -sdk iphoneos \
            archive \
            -archivePath build/${APP_NAME}.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA
        run: |
          mkdir Payload
          cp -R build/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app Payload/
          zip -r ${APP_NAME}.ipa Payload
          mv ${APP_NAME}.ipa .

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: "*.ipa"
