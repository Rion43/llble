name: Build iOS Dev Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install -g expo
          npm install

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Generate iOS project
        run: |
          npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install

      - name: Read App Name
        run: |
          echo "APP_NAME=$(node -p "require('./package.json').name")" >> $GITHUB_ENV

      - name: Build Archive
        run: |
          xcodebuild \
            -workspace ios/${APP_NAME}.xcworkspace \
            -scheme ${APP_NAME} \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath build/${APP_NAME}.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA
        run: |
          mkdir Payload
          cp -R build/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app Payload/
          cd Payload
          zip -r ../${APP_NAME}.ipa .
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: "*.ipa"
